<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국어학 기말 암기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap');

  :root{
    --ink:#1a1410;
    --paper:#f7f3ec;
    --card:#fffdf8;
    --rule:#d8cfbf;
    --cinnabar:#c0392b;
    --jade:#3a7d6e;
    --gold:#b8860b;
    --muted:#8a8175;
    --shadow:0 2px 0 rgba(26,20,16,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    padding:0 0 80px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}

  header{
    border-bottom:2px solid var(--ink);
    padding:22px 0 14px;
    margin-bottom:18px;
    position:relative;
  }
  header .eyebrow{
    font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--cinnabar);font-weight:700;
  }
  header h1{
    font-family:'Noto Serif KR',serif;font-weight:900;
    font-size:clamp(26px,7vw,40px);line-height:1.1;margin-top:4px;
  }
  header .sub{color:var(--muted);font-size:13px;margin-top:6px}

  /* progress */
  .progress{
    position:sticky;top:0;z-index:20;background:var(--paper);
    padding:10px 0;border-bottom:1px solid var(--rule);
  }
  .progress .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
  .progress .fill{height:100%;background:var(--cinnabar);width:0;transition:width .3s}
  .progress .label{font-size:12px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}

  /* mode tabs */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
  .tab{
    flex:1 1 auto;min-width:80px;padding:9px 10px;border:1.5px solid var(--ink);
    background:var(--card);font-weight:700;font-size:13px;cursor:pointer;
    border-radius:2px;transition:.15s;text-align:center;
  }
  .tab.active{background:var(--ink);color:var(--paper)}

  /* topic picker */
  .picker{margin:0 0 18px}
  .picker summary{
    cursor:pointer;font-weight:700;font-size:13px;padding:8px 0;
    color:var(--jade);list-style:none;
  }
  .picker summary::-webkit-details-marker{display:none}
  .picker summary::before{content:"▸ ";color:var(--cinnabar)}
  .picker[open] summary::before{content:"▾ "}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
  .chip{
    font-size:12px;padding:5px 10px;border:1px solid var(--rule);
    background:var(--card);border-radius:14px;cursor:pointer;user-select:none;
  }
  .chip.on{background:var(--jade);color:#fff;border-color:var(--jade)}

  /* card */
  .card{
    background:var(--card);border:1.5px solid var(--ink);border-radius:4px;
    box-shadow:var(--shadow);padding:24px 22px;min-height:240px;
    display:flex;flex-direction:column;
  }
  .card .topic{
    font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:12px;
  }
  .card .q{
    font-family:'Noto Serif KR',serif;font-weight:600;
    font-size:clamp(18px,4.5vw,23px);line-height:1.4;
  }
  .card .a{
    margin-top:18px;padding-top:16px;border-top:1px dashed var(--rule);
    font-size:15px;white-space:pre-wrap;
  }
  .card .a .zh{color:var(--cinnabar);font-weight:700}
  .hidden{display:none}

  .reveal-hint{margin-top:auto;padding-top:18px;color:var(--muted);font-size:13px;text-align:center}

  /* fill blank input */
  .fill-in{
    width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--rule);
    border-radius:3px;margin-top:16px;font-family:inherit;background:#fff;
  }
  .fill-in:focus{outline:none;border-color:var(--jade)}
  .verdict{margin-top:12px;font-weight:700;font-size:14px}
  .verdict.ok{color:var(--jade)}
  .verdict.no{color:var(--cinnabar)}

  /* quiz options */
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .opt{
    padding:11px 14px;border:1.5px solid var(--rule);background:#fff;
    border-radius:3px;cursor:pointer;font-size:15px;text-align:left;transition:.12s;
  }
  .opt:hover{border-color:var(--ink)}
  .opt.correct{background:#e8f3ef;border-color:var(--jade);color:var(--jade);font-weight:700}
  .opt.wrong{background:#fbeae8;border-color:var(--cinnabar);color:var(--cinnabar)}
  .opt:disabled{cursor:default}

  /* controls */
  .controls{display:flex;gap:10px;margin-top:18px}
  .btn{
    flex:1;padding:13px;border:1.5px solid var(--ink);background:var(--ink);
    color:var(--paper);font-weight:700;font-size:15px;border-radius:3px;
    cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:var(--card);color:var(--ink)}
  .btn:active{transform:translateY(1px)}

  .stat-line{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:14px;justify-content:center}
  .stat-line b{color:var(--ink)}

  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">中國語學 · 期末</div>
    <h1>중국어학 기말 암기</h1>
    <div class="sub">단어·형태소부터 把·被구문까지 · 빈칸/단답 + 서술형 대비</div>
  </header>

  <div class="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="label"><span id="pcount">0 / 0</span><span id="pmode">플래시카드</span></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-mode="flash">플래시카드</div>
    <div class="tab" data-mode="fill">빈칸 채우기</div>
    <div class="tab" data-mode="quiz">객관식 퀴즈</div>
  </div>

  <details class="picker">
    <summary>주제 선택 / 섞기</summary>
    <div class="chips" id="chips"></div>
  </details>

  <div id="stage"></div>

  <div class="stat-line">
    <span>맞음 <b id="sc-ok">0</b></span>
    <span>틀림 <b id="sc-no">0</b></span>
    <span>본 카드 <b id="sc-seen">0</b></span>
  </div>

  <footer>이 데이터는 업로드한 답안지를 그대로 카드화한 것입니다 · 셔플은 매번 무작위</footer>
</div>

<script>
/* ---------- DATA ---------- */
/* type: term card. q=질문, a=답(서술), zh=중국어 키워드 강조용, blank=빈칸정답들 */
const CARDS = [
 {t:"1.단어와 형태소", q:"단어의 문법적 정의는?", a:"독립적으로 운용할 수 있는 최소의 언어 단위", blank:["독립","최소"]},
 {t:"1.단어와 형태소", q:"단어의 어휘적 정의는?", a:"어음과 의미가 결합한 완정하고 정형적인 최소의 언어건축재료", blank:["완정","정형","최소"]},
 {t:"1.단어와 형태소", q:"'완정 / 정형 / 최소' 각 기준으로 무엇을 구별하는가?", a:"완정→단어 구성 성분 구별\n정형→자유구 구별\n최소→고정구 구별", blank:["성분","자유구","고정구"]},
 {t:"1.단어와 형태소", q:"형태소→단어→구→문장 결합 순서를 말하라", a:"형태소끼리 만나면 단어 / 단어끼리 만나면 구 / 구끼리 만나면 문장. 어휘=단어+고정구"},

 {t:"2.형태소 분류", q:"자립 여부에 따른 형태소 3종은?", a:"자립형태소 / 반자립형태소(=어근형태소,변화x) / 의존형태소(=비자립=접사, 반드시 결합)", blank:["자립","반자립","의존"]},
 {t:"2.형태소 분류", q:"실질 의미 여부에 따른 분류는?", a:"실질형태소=어근 / 형식형태소=접사", blank:["어근","접사"]},
 {t:"2.형태소 분류", q:"형태 변화 여부에 따른 분류는?", a:"어간형태소=변화x / 어미형태소=변화o", blank:["어간","어미"]},
 {t:"2.형태소 분류", q:"음절 개수에 따른 분류는? (중국어 기본어휘는?)", a:"쌍음절 형태소=중국어 기본 어휘 / 다음절 형태소", blank:["쌍음절","다음절"]},

 {t:"3.구사법", q:"구사법이란?", a:"(형태소로) 단어를 구성하는 규칙 = 단어 내부 구조. 어법적 각도로 분석", blank:["단어","내부 구조"]},
 {t:"3.구사법", q:"구사법의 '전통적 의미'는?", a:"단어의 구조를 문장의 구조와 같다고 봄. 복합어를 주술/동목/술보/편정/연합/중첩식으로 분류하고 통사적 방식으로 구성되었다고 이해"},
 {t:"3.구사법", q:"구사법의 '최근 의미'는?", a:"단어 구조를 형태소가 단어를 어떻게 구성하는지로 봄. 복합어는 어휘 속성이지 통사 속성이 아니므로 문장처럼 분석 불가. '단순어·파생어·복합어' 분석이 곧 구사법"},
 {t:"3.구형법", q:"구형법이란?", a:"단어가 어법적으로 여러 형태 변화(굴절)를 일으키는 규칙 = 문법관계를 나타냄 (성·수·격·시제·상)", blank:["굴절","문법관계"]},
 {t:"3.구형법", q:"인도유럽어 vs 중국어의 구형 차이?", a:"인도유럽어: 단어 내부 변화 있음(어미 첨가·모음 변화), 굴절 수단=어미(词尾,굴절형태소).\n중국어: 단어 밖으로 확장, 어형 변화 없음, 동태조사 붙고 단어 중첩", zh:"词尾"},

 {t:"5.복합어 내부구조", q:"병렬식(연합식)의 3종 관계는?", a:"동의(비슷) / 대칭(상반) / 평행(유사)", blank:["동의","대칭","평행"]},
 {t:"5.복합어 내부구조", q:"편정식 구조는?", a:"수식어 + 중심어", blank:["수식어","중심어"]},
 {t:"5.복합어 내부구조", q:"술(후)보식 구조는?", a:"중심어 + 보충성분. 중심이 명사성(보충=양사 또는 명사+은유) / 중심이 동사성", blank:["중심어","보충성분"]},
 {t:"5.복합어 내부구조", q:"주술식 구조 2종은?", a:"명사+동사 / 명사+형용사"},
 {t:"5.복합어 내부구조", q:"동목식 구조는?", a:"동사+목적어 (동사+명사 / 동사+형용사 / 동사+동사)", blank:["동사","목적어"]},
 {t:"5.복합어 내부구조", q:"축합식 4종은?", a:"생략 / 축약 / 총괄 / 간대"},
 {t:"5.복합어 내부구조", q:"성분 배치 관계 3종(연합/편정/후보)은?", a:"연합식: 성분 동등 결합 / 편정식: 부가성분이 중심 앞 / 후보식(술보식): 부가성분이 중심 뒤"},
 {t:"5.복합어 내부구조", q:"图书 / 大门 / 看见 은 각각 어떤 식?", a:"图书=연합식(동등) / 大门=편정식(앞 부가) / 看见=후보식(뒤 부가)", zh:"图书 大门 看见"},
 {t:"5.형태사", q:"형태사란?", a:"굴절 기능을 담당하고 형태변화를 나타내는 단어. 의미 기능보다 형태적·문법적 기능. 예) 복수표지 们, 동태조사 了·着·过", zh:"们 了 着 过"},

 {t:"5.품사분류기준", q:"품사 분류 3기준은?", a:"어법기능(어떤 문장성분 충당/결합 가능) / 형태변화 / 의미", blank:["어법기능","형태변화","의미"]},
 {t:"6.품사와 문장성분", q:"품사↔문장성분 대응: 인도유럽어 vs 중국어?", a:"인도유럽어 1:1 대응 / 중국어 1:다 대응. 예) 명사=주어·술어·목적어·관형어·부사어"},

 {t:"7.명사술어문", q:"'今天星期六' 주어·술어 분석은?", a:"주어=今天 / 술어=星期六 (명사가 술어)", zh:"今天 星期六"},

 {t:"접속사", q:"연합-병렬관계 접속사는?", a:"和 跟 同 与 及 以及 而 既", zh:"和 跟 同 与 及 以及 而 既"},
 {t:"접속사", q:"연합-선택관계 접속사는?", a:"或 或者 还是 要么 宁可 与其", zh:"或 或者 还是 要么 宁可 与其"},
 {t:"접속사", q:"연합-점진관계 접속사는?", a:"不但 不仅 而 而且 并 并且 何况 况且 甚至", zh:"不但 不仅 而且 并且 甚至"},
 {t:"접속사", q:"연합-승접관계 접속사는?", a:"然后 于是", zh:"然后 于是"},
 {t:"접속사", q:"편정-양보관계 접속사는?", a:"虽然 尽管 即使 固然 就是 哪怕", zh:"虽然 尽管 即使 固然 哪怕"},
 {t:"접속사", q:"편정-전환관계 접속사는?", a:"只是 不过 可是 但是 然而", zh:"只是 不过 可是 但是 然而"},
 {t:"접속사", q:"편정-가정관계 접속사는?", a:"如果 要是 假如 倘若", zh:"如果 要是 假如 倘若"},
 {t:"접속사", q:"편정-조건관계 접속사는?", a:"只要 只有 无论 不论 不管 除非", zh:"只要 只有 无论 不管 除非"},
 {t:"접속사", q:"편정-인과관계 접속사는?", a:"因为 所以 由于 因此 因而 既然", zh:"因为 所以 由于 因此 既然"},

 {t:"8.겸류", q:"겸류란? 조건은?", a:"하나의 단어가 여러 품사 역할. 조건: 자형·어음·의미가 밀접해야 함. 예) 麻烦(형/동/명), 方便, 便宜", zh:"麻烦 方便 便宜"},
 {t:"8.빈어 의미관계", q:"动作支配 / 关涉的对象 의 뜻은?", a:"动作支配: 동작(동사)이 다른 성분을 지배, 동사가 구조 결정.\n关涉的对象: 동작이 직접 관련되는 대상 = 목적어. 빈어는 반드시 수사 아님(존현빈어·도구·처소명사 등)", zh:"动作支配 关涉的对象"},

 {t:"9.보어vs빈어", q:"보어와 빈어를 형식·질문으로 구분하면?", a:"형식: 둘 다 동사(술어) 뒤. 빈어=무엇?/누구? / 보어=어떻게?\n동량보어와 빈어 구분, 시량보어와 빈어 구분. 술어 뒤 수량구 있으면 把자문 전환 불가"},

 {t:"10.谓语vs述语", q:"谓语와 述语의 관계는?", a:"같은 층차 아님. 谓语는 주어를 전제, 述语는 빈어를 전제. 谓语가 述语를 포함. 주어=화제, 술어=진술", zh:"谓语 述语"},
 {t:"10.谓语vs述语", q:"층차분석: 주어/술어 → 다시 무엇으로 나누나?", a:"먼저 주술구조(주어 앞·谓语 뒤)로 나눔. 谓语 안에서 술빈구조(述语 앞·宾语 뒤)로 나눔. 述语=동작, 宾语=동작이 관련되는 대상", zh:"述宾结构"},

 {t:"11.주술서술어문", q:"'他身体不好' 주어·술어 분석은?", a:"주어=他 / 술어=身体不好. 대주어=他, 소주어=身体", zh:"他 身体不好"},
 {t:"11.주술서술어문", q:"'我什么都不想吃' 대·소주어와 의미역은?", a:"대주어=我(시사) / 소주어=什么(수사)", zh:"我 什么"},
 {t:"11.주술서술어문", q:"주술서술어 의미관계 2종은?", a:"1.소유관계 2.시사–수사 관계 (시사·수사·시간·장소·도구·영속 / 소유·소속)", blank:["소유","시사","수사"]},
 {t:"11.편정구조", q:"중국어에서 수식할 수 있는 두 성분은?", a:"관형어 / 부사어. 定中结构(관형어+중심어), 状中结构(부사어+중심어)", zh:"定中结构 状中结构"},

 {t:"12.방향보어 확장", q:"방향보어 '上'의 확장 의미는?", a:"목표달성 / 접촉부착 / 시작 / 지속 / 첨가", zh:"上"},
 {t:"12.방향보어 확장", q:"방향보어 '下'의 확장 의미는?", a:"분리 / 남겨짐 / 동적→정적 / 수용", zh:"下"},
 {t:"12.방향보어 확장", q:"방향보어 '出'의 확장 의미는?", a:"인식 / 무→유", zh:"出"},
 {t:"12.방향보어 확장", q:"'下来'의 확장 의미는?", a:"분리 / 남겨짐 / 동→정 / 명→암", zh:"下来"},
 {t:"12.방향보어 확장", q:"'下去' / '出来'의 확장 의미는?", a:"下去: 동작 계속 / 出来: 인식, 무→유", zh:"下去 出来"},
 {t:"12.방향보어 확장", q:"'过来' / '过去'의 확장 의미는?", a:"过来: 비정상→정상 / 过去: 정상→비정상", zh:"过来 过去"},
 {t:"12.방향보어 확장", q:"'起来'의 확장 의미는?", a:"시작 / 예측·평가 / 분산→집중 / 떠오름", zh:"起来"},
 {t:"12.방향동사", q:"방향동사: 이동방식과 이동방향 표지는?", a:"이동방식: 上 下 进 出 回 过 起 开 / 이동방향: 来 去", zh:"上下进出回过起开 来去"},

 {t:"13.방향보어+목적어 위치", q:"목적어 유형별 방향보어와의 위치는?", a:"일반명사: 보어 사이 또는 보어 뒤\n처소사: 보어 사이만\n이합동사: 보어 사이만"},
 {t:"14.시량보어 위치", q:"시량보어란? 목적어 유형별 위치는?", a:"시량보어=동작 지속 시간을 나타내려 동사 뒤 부가.\n일반명사: 동사+시량보어+(的)+목적어\n인칭대사: 동사+목적어+시량보어\n인명/지명: 동사+시량보어+(的)+목적어"},
 {t:"15.동량보어 위치", q:"동량보어란? 목적어 유형별 위치는?", a:"동량보어=동작 횟수, '수사+동량사' 형식.\n일반명사: 동사+동량보어+목적어\n인칭대사: 동사+목적어+동량보어\n인명/지명: 동사+(목적어)+동량보어"},
 {t:"15.개사구보어", q:"개사구보어란? 최근 주장은?", a:"개사(전치사)+명사구가 술어 뒤에서 보충. 전통: 수량 적고 결과보어로 봄. 최근: 시간·처소·기점·방향·대상·비교·원인·출처 등 보충하므로 결과보어와 별개", zh:"介词"},
 {t:"15.개사구보어", q:"개사별 보충 관계 (到 在 自 往 给 于)는?", a:"到-시간, 在-처소, 自-기점, 往-방향, 给-대상, 于-비교, 于-원인, 自-출처. 예) 送他到家", zh:"到 在 自 往 给 于"},

 {t:"16.연동문vs겸어문", q:"연동문의 특징은?", a:"대주어 하나, 동작의 시간 순서 존재. 동태조사 위치가 의미에 따라 달라짐. 쉼표로 못 띄움. 술어 위치 못 바꿈. 술어 사이 연합·주술·동빈·보충 관계 없음. 술어 모두 목적어 가능"},
 {t:"16.연동문vs겸어문", q:"겸어문이란? 동사 3유형은?", a:"한 성분이 주어와 목적어를 겸함.\n사역·요구·명령: 让 请 叫 / 심리상태: 希望 怕 爱 / 호칭·인정: 叫 称 当", zh:"让 请 叫 希望 怕 爱 称 当"},
 {t:"16.이중목적어문", q:"이중목적어문 구조는?", a:"동사가 목적어 2개를 취함. 주어+동사+간접목적어(사람)+직접목적어"},

 {t:"17.존현문vs은현문", q:"존현문과 은현문 구조는?", a:"존현문: 처소사+有/是+명사 / 은현문: 시간사+동사+명사", zh:"有 是"},
 {t:"17.존현문vs은현문", q:"존현·은현문 부정은? 예외는?", a:"둘 다 没로 부정. 예외로 不 사용(가설·불허·미계획). 예) 早上来了一位客人 → 客人은 시사(빈어가 무조건 수사는 아님)", zh:"没 不"},

 {t:"18.把구문", q:"把구문 기본 어순은?", a:"주어+부정부사+把+목적어+동사+부가성분", zh:"把"},
 {t:"18.把구문", q:"把구문의 부가성분 종류는?", a:"결과보어·정도보어·상태보어·개사구보어·방향보어·동량보어·시량보어 + 중첩 + 간접목적어 + 부사 '一' + 개사구 往·当·朝 + 동태조사 了·着", zh:"把 一 往 当 朝 了 着"},

 {t:"19.被구문", q:"被구문의 부가성분 종류는?", a:"결과보어·정도보어·상태보어·개사구보어·방향보어", zh:"被"},
 {t:"19.被구문", q:"피동 표지 4종과 어감 차이는?", a:"被 叫 让 给. 叫·让=불쾌한 상황 / 给=구어체·피동 강조. 被는 叫·让·给로 대체 가능", zh:"被 叫 让 给"},
 {t:"19.被구문", q:"被구문 대상자 생략 규칙은?", a:"被·给 뒤 대상자 생략 가능 / 叫·让 뒤 대상자 생략 불가. 피동 강조 위해 给를 동사 앞 한 번 더 사용 가능. 예) 钱包被小偷(给)偷走了", zh:"被 给 叫 让"}
];

/* ---------- STATE ---------- */
let topics = [...new Set(CARDS.map(c=>c.t))];
let activeTopics = new Set(topics);
let mode = "flash";
let deck = [];
let idx = 0;
let revealed = false;
let answered = false;
let score = {ok:0,no:0,seen:0};

/* ---------- BUILD CHIPS ---------- */
const chipsEl = document.getElementById('chips');
function buildChips(){
  chipsEl.innerHTML="";
  const all=document.createElement('div');
  all.className="chip on";all.textContent="전체";
  all.onclick=()=>{activeTopics=new Set(topics);buildChips();rebuild();};
  chipsEl.appendChild(all);
  topics.forEach(t=>{
    const c=document.createElement('div');
    c.className="chip"+(activeTopics.has(t)?" on":"");
    c.textContent=t;
    c.onclick=()=>{
      if(activeTopics.has(t))activeTopics.delete(t);else activeTopics.add(t);
      if(activeTopics.size===0)activeTopics.add(t);
      buildChips();rebuild();
    };
    chipsEl.appendChild(c);
  });
}

/* ---------- DECK ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rebuild(){
  let pool=CARDS.filter(c=>activeTopics.has(c.t));
  if(mode==="fill")pool=pool.filter(c=>c.blank&&c.blank.length);
  deck=shuffle([...pool]);
  idx=0;score={ok:0,no:0,seen:0};
  render();updateScore();
}

/* ---------- RENDER ---------- */
const stage=document.getElementById('stage');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function zhWrap(text,zh){
  if(!zh)return esc(text);
  let out=esc(text);
  zh.split(/\s+/).forEach(w=>{if(w)out=out.split(esc(w)).join('<span class="zh">'+esc(w)+'</span>');});
  return out;
}

function render(){
  revealed=false;answered=false;
  if(deck.length===0){stage.innerHTML='<div class="card"><div class="q">선택된 카드가 없어요. 주제를 골라주세요.</div></div>';updateProgress();return;}
  const c=deck[idx];
  if(mode==="flash")renderFlash(c);
  else if(mode==="fill")renderFill(c);
  else renderQuiz(c);
  updateProgress();
}

function renderFlash(c){
  stage.innerHTML=`
   <div class="card" id="card">
     <div class="topic">${esc(c.t)}</div>
     <div class="q">${esc(c.q)}</div>
     <div class="a hidden" id="ans"><span style="white-space:pre-wrap">${zhWrap(c.a,c.zh)}</span></div>
     <div class="reveal-hint" id="hint">탭하면 정답 보기</div>
   </div>
   <div class="controls">
     <button class="btn ghost" onclick="prev()">← 이전</button>
     <button class="btn" onclick="next(true)">다음 →</button>
   </div>`;
  document.getElementById('card').onclick=()=>{
    if(revealed)return;
    revealed=true;
    document.getElementById('ans').classList.remove('hidden');
    document.getElementById('hint').classList.add('hidden');
    score.seen++;updateScore();
  };
}

function renderFill(c){
  const need=c.blank;
  stage.innerHTML=`
   <div class="card">
     <div class="topic">${esc(c.t)}</div>
     <div class="q">${esc(c.q)}</div>
     <div style="font-size:12px;color:var(--muted);margin-top:8px">핵심어 ${need.length}개를 입력 (쉼표·공백 구분)</div>
     <input class="fill-in" id="fin" placeholder="예: ${esc(need[0])} ..." autocomplete="off">
     <div class="verdict" id="vd"></div>
     <div class="a hidden" id="ans"><span style="white-space:pre-wrap">${zhWrap(c.a,c.zh)}</span></div>
   </div>
   <div class="controls">
     <button class="btn ghost" onclick="checkFill()">채점</button>
     <button class="btn" onclick="next(true)">다음 →</button>
   </div>`;
  const inp=document.getElementById('fin');inp.focus();
  inp.onkeydown=e=>{if(e.key==='Enter')answered?next(true):checkFill();};
}
function checkFill(){
  if(answered)return;answered=true;
  const c=deck[idx];const val=document.getElementById('fin').value;
  const toks=val.split(/[\s,，、]+/).map(s=>s.trim()).filter(Boolean);
  const got=c.blank.filter(b=>toks.some(t=>t.includes(b)||b.includes(t)&&t.length>=1));
  const all=got.length===c.blank.length;
  const vd=document.getElementById('vd');
  vd.className="verdict "+(all?"ok":"no");
  vd.textContent=all?`정답! (${got.length}/${c.blank.length})`:`아쉬워요 (${got.length}/${c.blank.length}) · 정답 핵심어: ${c.blank.join(", ")}`;
  document.getElementById('ans').classList.remove('hidden');
  score.seen++;if(all)score.ok++;else score.no++;updateScore();
}

function renderQuiz(c){
  // build distractors from other cards' answers
  const others=shuffle(CARDS.filter(x=>x.a!==c.a)).slice(0,3).map(x=>x.a);
  const opts=shuffle([c.a,...others]);
  stage.innerHTML=`
   <div class="card">
     <div class="topic">${esc(c.t)}</div>
     <div class="q">${esc(c.q)}</div>
     <div class="opts" id="opts"></div>
   </div>
   <div class="controls">
     <button class="btn" onclick="next(true)">다음 →</button>
   </div>`;
  const wrap=document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className="opt";b.innerHTML=zhWrap(o.length>90?o.slice(0,90)+"…":o,c.zh);
    b.onclick=()=>{
      if(answered)return;answered=true;score.seen++;
      [...wrap.children].forEach(x=>x.disabled=true);
      if(o===c.a){b.classList.add('correct');score.ok++;}
      else{b.classList.add('wrong');score.no++;
        [...wrap.children].forEach(x=>{if(x.dataset.correct)x.classList.add('correct');});}
      updateScore();
    };
    if(o===c.a)b.dataset.correct="1";
    wrap.appendChild(b);
  });
}

/* ---------- NAV ---------- */
function next(){if(deck.length===0)return;idx=(idx+1)%deck.length;render();}
function prev(){if(deck.length===0)return;idx=(idx-1+deck.length)%deck.length;render();}

function updateProgress(){
  document.getElementById('fill').style.width=deck.length?((idx+1)/deck.length*100)+"%":"0%";
  document.getElementById('pcount').textContent=deck.length?`${idx+1} / ${deck.length}`:"0 / 0";
  const names={flash:"플래시카드",fill:"빈칸 채우기",quiz:"객관식 퀴즈"};
  document.getElementById('pmode').textContent=names[mode];
}
function updateScore(){
  document.getElementById('sc-ok').textContent=score.ok;
  document.getElementById('sc-no').textContent=score.no;
  document.getElementById('sc-seen').textContent=score.seen;
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');mode=t.dataset.mode;rebuild();
  };
});

/* ---------- INIT ---------- */
buildChips();rebuild();
</script>
</body>
</html>
