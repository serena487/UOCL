<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중어이 기말 — 중국어 빈칸·서술형</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f2f1ee;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --text: #1a1917;
    --text-2: #6b6a66;
    --text-3: #a09e9a;
    --ok: #1d7a4e;
    --ok-bg: #eaf6f0;
    --ok-border: #9fd6bc;
    --ng: #b93232;
    --ng-bg: #fdf0f0;
    --ng-border: #f5b8b8;
    --accent: #3a56d4;
    --accent-bg: #eef1fc;
    --warn: #b96a00;
    --warn-bg: #fdf4e7;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-title { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .header-sub { font-size: 12px; color: var(--text-2); margin-left: 8px; }

  .tab-row {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: 8px;
    padding: 3px;
  }
  .tab {
    padding: 5px 16px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-2);
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .main { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .stats { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    min-width: 80px;
  }
  .stat-n { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-n.ok { color: var(--ok); }
  .stat-n.ng { color: var(--ng); }
  .stat-l { font-size: 11px; color: var(--text-3); margin-top: 1px; }

  .action-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .btn {
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-md);
    background: var(--surface);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
    transition: background .12s;
  }
  .btn:hover { background: var(--surface2); }
  .btn-danger { color: var(--ng); border-color: var(--ng-border); }
  .btn-danger:hover { background: var(--ng-bg); }

  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .filter-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-md);
    background: transparent;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-2);
    cursor: pointer;
    transition: all .12s;
  }
  .filter-btn.on {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: .07em;
    text-transform: uppercase;
    margin: 2rem 0 0.75rem;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .qcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.25rem;
    margin-bottom: 0.75rem;
    transition: border-color .2s;
  }
  .qcard.correct { border-color: var(--ok-border); background: var(--ok-bg); }
  .qcard.wrong   { border-color: var(--ng-border); }

  .qmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .qnum  { font-size: 11px; color: var(--text-3); }
  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .badge-blank { background: var(--accent-bg); color: var(--accent); }
  .badge-essay { background: var(--warn-bg); color: var(--warn); }

  .q-label {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .qtext { font-size: 14px; line-height: 2; margin-bottom: 8px; }

  .blank-wrap { display: inline-block; vertical-align: bottom; margin: 0 2px; }
  .blank-wrap input {
    border: none;
    border-bottom: 2px solid var(--border-md);
    background: transparent;
    outline: none;
    font-size: 14px;
    color: var(--text);
    text-align: center;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 0 4px;
    min-width: 76px;
    transition: border-color .15s;
  }
  .blank-wrap input:focus { border-bottom-color: var(--accent); }
  .blank-wrap input.ok  { color: var(--ok);  border-bottom-color: var(--ok); }
  .blank-wrap input.ng  { color: var(--ng);  border-bottom-color: var(--ng); }

  .hint { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }

  .essay-area {
    width: 100%;
    border: 1px solid var(--border-md);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    background: var(--surface2);
    resize: vertical;
    min-height: 90px;
    line-height: 1.7;
    margin-bottom: 10px;
    transition: border-color .15s, background .15s;
  }
  .essay-area:focus { outline: none; border-color: var(--accent); background: var(--surface); }

  .ans-box {
    display: none;
    background: var(--ok-bg);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 13px;
    color: var(--ok);
    margin-top: 8px;
    line-height: 1.7;
    border-left: 3px solid var(--ok-border);
  }
  .ans-box.show { display: block; }

  .essay-ans-box {
    display: none;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-2);
    margin-top: 6px;
    line-height: 1.8;
    border-left: 3px solid var(--ok-border);
  }
  .essay-ans-box.show { display: block; }
  .essay-ans-box strong { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 5px; letter-spacing: .04em; }

  .bottom-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .btn-check {
    padding: 5px 14px;
    font-size: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-md);
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    transition: background .12s;
  }
  .btn-check:hover { background: var(--surface2); }
  .fb       { font-size: 12px; font-weight: 500; }
  .fb.ok    { color: var(--ok); }
  .fb.ng    { color: var(--ng); }

  .wn-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.25rem;
  }
  .wn-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .wn-title { font-size: 15px; font-weight: 700; }
  .wn-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--ng-bg);
    color: var(--ng);
    font-weight: 700;
  }
  .wn-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .wn-item:last-child { border-bottom: none; }
  .wn-q   { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .wn-row { display: flex; gap: 16px; font-size: 13px; font-weight: 500; }
  .wn-wrong { color: var(--ng); }
  .wn-right { color: var(--ok); }
  .empty  { font-size: 13px; color: var(--text-3); padding: 8px 0; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center">
    <span class="header-title">중어이 기말 — 중국어 빈칸·서술형</span>
    <span class="header-sub">7강–13강</span>
  </div>
  <div class="tab-row">
    <button class="tab active" onclick="switchTab('blank',this)">빈칸형(중국어)</button>
    <button class="tab" onclick="switchTab('essay',this)">서술형</button>
    <button class="tab" onclick="switchTab('wrong',this)">오답 노트</button>
  </div>
</header>

<main class="main">
  <div class="stats">
    <div class="stat"><div class="stat-n ok" id="sc-ok">0</div><div class="stat-l">정답</div></div>
    <div class="stat"><div class="stat-n ng" id="sc-ng">0</div><div class="stat-l">오답</div></div>
    <div class="stat"><div class="stat-n" id="sc-tot">0</div><div class="stat-l">전체</div></div>
    <div class="stat"><div class="stat-n" id="sc-wn">0</div><div class="stat-l">오답 노트</div></div>
  </div>

  <div class="action-row" id="action-row">
    <button class="btn" id="btn-all" onclick="checkAllVisible()">전체 채점</button>
    <button class="btn" onclick="resetVisible()">초기화</button>
    <button class="btn" onclick="showAllAns()">정답 모두 보기</button>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn on" onclick="filterSection('all',this)">전체</button>
    <button class="filter-btn" onclick="filterSection('7강',this)">7강</button>
    <button class="filter-btn" onclick="filterSection('8강',this)">8강</button>
    <button class="filter-btn" onclick="filterSection('9강',this)">9강</button>
    <button class="filter-btn" onclick="filterSection('10강',this)">10강</button>
    <button class="filter-btn" onclick="filterSection('11강',this)">11강</button>
    <button class="filter-btn" onclick="filterSection('12강',this)">12강</button>
    <button class="filter-btn" onclick="filterSection('13강',this)">13강</button>
  </div>

  <div id="page-blank"></div>
  <div id="page-essay" class="hidden"></div>

  <div id="page-wrong" class="hidden">
    <div class="wn-wrap">
      <div class="wn-head">
        <span class="wn-title">오답 노트</span>
        <span class="wn-badge" id="wn-cnt">0</span>
      </div>
      <div id="wn-body"><div class="empty">아직 채점된 오답이 없어요.</div></div>
      <button class="btn btn-danger" style="margin-top:12px" onclick="clearWN()">오답 초기화</button>
    </div>
  </div>
</main>

<script>
const BLANKS=[
  {id:'b1',sec:'7강',label:'언어 건축재료의 자격을 갖춘 단위',
   tpl:'언어의 \'건축 재료\' 자격을 갖춘 단위는 단어와 고정구이다. 예) <b data-id="b1_a">(a)</b> (생산), <b data-id="b1_b">(b)</b> (성어/관용어, 欢天喜地 종류)',
   blanks:[{id:'b1_a',ans:'生産|生产',lbl:'(a) 단어 예'},{id:'b1_b',ans:'欢天喜地|聚精会神',lbl:'(b) 고정구 예'}]},
  {id:'b2',sec:'7강',label:'단어의 어법 정의의 한계 — A·B·C 예문',
   tpl:'B번 예시 开门见山, <b data-id="b2_a">(a)</b>는 \'최소\'의 측면에서 단어와 인접 단위를 구분하는 데 어려움을 보여준다.',
   blanks:[{id:'b2_a',ans:'有过之而无不及',lbl:'(a) B번 예'}]},
  {id:'b3',sec:'7강',label:'동일 단어의 이형태 통합 — C 예문',
   tpl:'C 예문: 我认识你很高兴。让我高兴高兴。他<b data-id="b3_a">(a)</b>地回家了。 — 이 세 가지 高兴 표현은 \'완정\'에 근거하여 동일한 단어의 이형태로 통합된다.',
   blanks:[{id:'b3_a',ans:'高高兴兴',lbl:'(a)'}]},
  {id:'b4',sec:'7강',label:'자립형태소(成词语素) 예',
   tpl:'자립형태소(成词语素): 독립적으로 단어가 되며 다른 형태소와 결합도 가능. 예) <b data-id="b4_a">(a)</b>, 牛, 火, 水, 走, 跑',
   blanks:[{id:'b4_a',ans:'地',lbl:'(a) 자립형태소 예'}]},
  {id:'b5',sec:'7강',label:'반자립형태소(不成词语素) 예',
   tpl:'반자립형태소(不成词语素): 독립적으로 단어가 될 수 없고 다른 형태소와 결합해야 단어를 이룸. 예) 民, 乡, <b data-id="b5_a">(a)</b>, 言, 伟, 习',
   blanks:[{id:'b5_a',ans:'语',lbl:'(a)'}]},
  {id:'b6',sec:'7강',label:'의존형태소(不自由词素) 예',
   tpl:'의존형태소(不自由词素): 어근에 붙는 파생접사 또는 어간에 붙는 굴절접사. 예) 阿, <b data-id="b6_a">(a)</b>, 子, 性, 者, 们',
   blanks:[{id:'b6_a',ans:'第',lbl:'(a)'}]},
  {id:'b7',sec:'7강',label:'실질형태소(어근) 예 — 단어 분해',
   tpl:'人民, 伟大, 热爱, <b data-id="b7_a">(a)</b>, 竹子, 老鼠, 阿婆 — 이 단어들에서 人, 民, 伟, 大, 熱, 爱, 石, 竹, 鼠, 婆는 모두 어근(실질형태소)이다.',
   blanks:[{id:'b7_a',ans:'石头',lbl:'(a)'}]},
  {id:'b8',sec:'7강',label:'파생접사 예',
   tpl:'파생접사(构词词缀)는 어근에 부가되어 새로운 단어를 만든다. 예) 第, 初, <b data-id="b8_a">(a)</b>, 儿, 化',
   blanks:[{id:'b8_a',ans:'子',lbl:'(a)'}]},
  {id:'b9',sec:'7강',label:'파생접사로 인한 품사 변화 — 绿化',
   tpl:'<b data-id="b9_a">(a)</b>는 绿에 化를 첨가하여 \'~하게 하다\'라는 동사의 의미유형을 나타내며 형용사에서 동사로 품사가 변화한다.',
   blanks:[{id:'b9_a',ans:'绿化',lbl:'(a)'}]},
  {id:'b10',sec:'7강',label:'파생접사로 인한 품사 변화 — 胖子',
   tpl:'<b data-id="b10_a">(a)</b>는 胖에 子를 첨가하여 \'~한 사람\'으로 개념의미가 바뀌었고 형용사에서 명사로 품사가 변화한다.',
   blanks:[{id:'b10_a',ans:'胖子',lbl:'(a)'}]},
  {id:'b11',sec:'7강',label:'굴절접사(어미) 예 — 孩子们',
   tpl:'굴절접사(构形词缀)는 어간에 부가되어 어법의미를 나타낸다. 예) 孩子<b data-id="b11_a">(a)</b>의 们',
   blanks:[{id:'b11_a',ans:'们',lbl:'(a)'}]},
  {id:'b12',sec:'7강',label:'어간 구성 예 — 어근 1개·2개·어근+접사',
   tpl:'어간은 어근 1개(买, 我)로, 어근 2개 이상(<b data-id="b12_a">(a)</b>, 见面)으로, 또는 어근+접사(孩子, 老师)로 구성될 수 있다.',
   blanks:[{id:'b12_a',ans:'学习',lbl:'(a)'}]},
  {id:'b13',sec:'8강',label:'전통적 복합어 구조 — 主谓型 예',
   tpl:'主谓型: 전 형태소가 진술 대상, 후 형태소가 그것을 진술. 예) 地震, 年轻, <b data-id="b13_a">(a)</b>, 心酸',
   blanks:[{id:'b13_a',ans:'肉麻',lbl:'(a)'}]},
  {id:'b14',sec:'8강',label:'전통적 복합어 구조 — 动宾型 예',
   tpl:'动宾型: 전 형태소가 동작, 후 형태소가 동작의 대상. 예) 司机, 管家, 站岗, <b data-id="b14_a">(a)</b>, 挂钩, 有限',
   blanks:[{id:'b14_a',ans:'投资',lbl:'(a)'}]},
  {id:'b15',sec:'8강',label:'전통적 복합어 구조 — 述补型 예',
   tpl:'述补型: 후 형태소가 전 형태소를 보충 설명. 예) 提高, <b data-id="b15_a">(a)</b>, 推翻, 合成, 压缩',
   blanks:[{id:'b15_a',ans:'说服',lbl:'(a)'}]},
  {id:'b16',sec:'8강',label:'전통적 복합어 구조 — 偏正型 정중관계 예',
   tpl:'偏正型 定中关系(전 형태소가 후 형태소를 수식/한정): 人流, 气功, <b data-id="b16_a">(a)</b>, 热心, 小心',
   blanks:[{id:'b16_a',ans:'冰箱',lbl:'(a)'}]},
  {id:'b17',sec:'8강',label:'전통적 복합어 구조 — 偏正型 상중관계 예',
   tpl:'偏正型 状中关系: 密植, <b data-id="b17_a">(a)</b>, 倾销, 筛选',
   blanks:[{id:'b17_a',ans:'游击',lbl:'(a)'}]},
  {id:'b18',sec:'8강',label:'전통적 복합어 구조 — 联合型 a유형',
   tpl:'联合型 ⓐ유형(상호 설명 가능): 途径, 价值, <b data-id="b18_a">(a)</b>',
   blanks:[{id:'b18_a',ans:'关闭',lbl:'(a)'}]},
  {id:'b19',sec:'8강',label:'전통적 복합어 구조 — 联合型 b유형',
   tpl:'联合型 ⓑ유형(새로운 의미 발생): 骨肉, <b data-id="b19_a">(a)</b>',
   blanks:[{id:'b19_a',ans:'领袖',lbl:'(a)'}]},
  {id:'b20',sec:'8강',label:'전통적 복합어 구조 — 联合型 c유형',
   tpl:'联合型 ⓒ유형(한 형태소의 의미만 작용): 国家, 质量, 窗户, <b data-id="b20_a">(a)</b>',
   blanks:[{id:'b20_a',ans:'人物',lbl:'(a)'}]},
  {id:'b21',sec:'8강',label:'중첩식(重叠式) 예',

  {id:'e1',sec:'7강',label:'단어의 어휘적 정의를 \'완정·정형·최소\'를 포함하여 설명하고, 각각 무엇과 단어를 구별 짓는지 서술하라.',
   model:'단어의 어휘적 정의: "어음과 의미가 결합한 완정(完整)하고 정형(定型)적인 최소(最小)의 언어 건축재료 단위." 완정(完整): 독립적인 완정체로서 이해되고, 있을 수 있는 여러 이형태가 하나로 통합됨 → 단어를 단어의 구성성분(형태소)과 구별. 정형(定型): 고정된 어음형식과 의미가 있어 임의로 바꿀 수 없음 → 단어와 자유구를 구별. 최소(最小): 더 이상 완정하고 정형적인 단위로 나눌 수 없음 → 단어와 고정구를 구별. 단어의 어법 정의("독립적으로 운용할 수 있는 최소의 언어단위")는 어휘 속성을 반영하지 못해 한계가 있으며, 단어의 본질적 속성은 어휘 속성에 있다.'},
  {id:'e2',sec:'7강',label:'언어 조직의 4가지 층급(형태소-단어-구-문장)을 설명하고, 자유구와 고정구가 각각 건축물인지 건축재료인지 그 이유와 함께 서술하라.',
   model:'언어 조직은 형태소-단어-구-문장의 4층급으로 구성된다. 문장은 건축물이다(건축 재료를 응용해 만든 결과물). 자유구(自由词组)는 건축물이다 — 어휘 단위를 자유롭게 임시 조합해 만든 구로, 발화의 성질을 가지며 사전에 등재되는 어휘항목이 아니기 때문이다. 고정구(固定词组)는 건축재료이다 — 형태적으로 정형화된 고정 구조(성어, 관용어, 헐후어)를 가지기 때문이다. 단어는 건축재료이다. 형태소는 건축재료가 아니다 — 형태소는 문장을 직접 구성하는 성분이 아니라 단어를 구성하는 더 낮은 층위이기 때문이다.'},
  {id:'e3',sec:'7강',label:'형태소를 자립 능력에 따라 자립·반자립·의존형태소로 분류하고 각각의 중국어 학술 명칭과 예를 들어 설명하라.',
   model:'①자립형태소(自由词素, 전통적으로 成词语素): 독립적으로 단어가 되며 다른 형태소와 결합해 단어를 만들 수도 있는 어근형태소. 예) 地, 牛, 火, 水, 走, 跑. ②반자립형태소(半自由词素, 전통적으로 不成词语素): 독립적으로 단어가 될 수 없고 다른 형태소와 결합해야만 단어를 만드는 어근형태소. 예) 民, 乡, 语, 言, 伟, 习. ③의존형태소(不自由词素, 비자립형태소): 독립적으로 단어가 될 수 없고 다른 어근에 붙어 단어를 만드는 파생접사 또는 어간에 붙어 어법의미를 나타내는 굴절접사(어미). 예) 阿, 第, 子, 性, 者, 们.'},
  {id:'e4',sec:'7강',label:'형식형태소(접사)를 파생접사와 굴절접사로 나누어 비교하고, 파생접사가 품사 변화를 일으키는 예(绿化, 胖子)를 들어 설명하라.',
   model:'형식형태소(词缀): 좁은 의미는 파생접사만, 넓은 의미는 파생접사와 굴절접사를 포함한다. 파생접사(构词词缀): 어근에 부가되어 단어의 의미유형이나 어법기능(품사)을 명시하며 새로운 단어를 만든다. 예) 绿化 — 绿(형용사)에 化를 첨가하여 \'~하게 하다\'의 동사 의미유형을 부여, 형용사→동사로 품사가 변화. 胖子 — 胖(형용사)에 子를 첨가하여 \'~한 사람\'의 개념의미로 바뀌어 형용사→명사로 품사가 변화. 굴절접사(构形词缀, 어미): 어간에 부가되어 어법의미만 바꾸며 새 단어를 만드는 기능은 없다. 예) 孩子们의 们. 다만 중국어에서는 들과 같은 단위를 굴절접사(어미)라고 부르기에 적절치 않다.'},
  {id:'e5',sec:'8강',label:'전통적 관점의 복합어 내부구조 6가지(主谓型·动宾型·述补型·偏正型·联合型·重叠型)를 각각 정의와 예를 들어 설명하라.',
   model:'①主谓型: 전 형태소가 진술 대상, 후 형태소가 그것을 진술. 예) 地震, 年轻, 肉麻, 心酸. ②动宾型: 전 형태소가 동작·행위, 후 형태소가 그 동작이 지배·관련된 사물. 예) 司机, 管家, 站岗, 投资, 挂钩, 有限. ③述补型: 후 형태소가 전 형태소를 보충 설명. 예) 提高, 说服, 推翻, 合成, 压缩. ④偏正型: 전 형태소가 후 형태소를 수식·한정. 定中关系(人流, 气功, 冰箱)와 状中关系(密植, 游击, 倾销)로 나뉨. ⑤联合型: 의미가 같거나 비슷·관련·반대인 두 어근의 병렬. 상호 설명형(途径, 价值), 새 의미 생성형(骨肉, 领袖), 한 형태소만 의미 작용형(国家, 质量)으로 나뉨. ⑥重叠型: 동일한 형태소(어근) 중첩. 예) 姐姐, 哥哥, 爹爹, 仅仅, 刚刚.'},
  {id:'e6',sec:'8강',label:'최근 이론에서 구사법(构词法)을 정의하고, 단일어·파생어·복합어·중복합어·유복합어·다중복합어의 구조층차를 예와 함께 설명하라.',
   model:'구사법: 형태소로부터 단어를 구성하는 법칙. 단어를 이루는 구조를 어법적으로 분석하여 단어 내부구조에서의 형태소 결합 방식을 설명. 무구조층차(无结构层次)인 단일어(单纯词)는 하나의 형태소(어근)로 구성. 예) 筆, 書, 畵, 猫, 玻璃. 一个结构层次인 파생어(派生詞)는 어근+접사 구조. 예) 第一(전綴+어근), 桌子(어근+후綴). 一个结构层次인 복합어(複合詞)는 두 개의 실질 어근. 예) 衣服, 马车, 小心. 两个结构层次인 중파생어(重派生詞)는 (어근+접사)+접사. 예) 孩子家. 两个结构层次인 중복합어(重複合詞)는 (어근+어근)+어근. 예) 游泳池. 两个结构层次인 유복합어(类複合詞)는 (어근+접사)+어근. 예) 玩儿命. 三个结构层次인 다중복합어(多重複合词)는 (3음절 중복합어/유복합어 어근)+형태소. 예) 南回归线, 山顶洞人.'},
  {id:'e7',sec:'8강',label:'인도유럽어와 중국어의 구형법(构形法)을 비교하고, 형태사(形态词)라는 명칭이 제안된 이유(劉叔新의 주장 포함)를 설명하라.',
   model:'구형법은 단어가 어법적으로 형태 변화(굴절)를 일으켜 성·수·격·시제·상의 어법의미를 나타내는 규칙이다. 인도유럽어: 어미첨가(book-books) 및 내부굴절/모음변화(foot-feet)로, 굴절을 일으키는 수단이 형태소(어미, 굴절형태소)이다. 중국어: 了·着·过·看·们과 같은 단위 및 중첩(漂漂亮亮)으로 구형 기능을 수행한다. 그러나 들은 강제성이 적고 임의성이 있으며(老师们都来了 = 老师都来了), 단어뿐 아니라 구에도 부가될 수 있다(讨论并通过了 老师和同学们). 劉叔新은 이들이 인도유럽어의 굴절어미와 동일한 작용을 하지만 굴절형태소가 아니라 독립적으로 하나의 품사를 형성한다는 점에 주목하여 형태사(形态词, morphological word)라는 명칭을 제안했다. 즉 중국어의 굴절수단은 ①중첩 사용, ②단어 내부에서 단어 밖으로 확장된다는 점에서 인도유럽어와 다르다.'},
  {id:'e8',sec:'9강',label:'겸류(兼类)의 개념과 성립 조건을 麻烦(형용사·동사·명사)의 예를 들어 설명하고, 겸류가 아닌 경우와 어떻게 구별되는지 서술하라.',
   model:'겸류(兼类)는 하나의 단어가 자형(글자 형태)·어음·의미가 밀접(동일)하면서 2개 이상의 품사를 겸하는 현상이다. 예) ①这件事很麻烦(형용사: 번거로움) ②我不想麻烦别人(동사: 폐를 끼치다) ③这件事给我们带来不少麻烦(명사: 골칫거리/문제). 麻烦은 자형·어음이 동일하고 의미적으로도 밀접하게 연관되어 있으므로 겸류로 인정된다. 겸류가 아닌 경우는 자형·어음은 같지만 서로 의미상 아무런 관련이 없는, 학자들이 우연히 동일하게 표기한 동음이의어 등이다. 즉 겸류의 핵심 조건은 자형·어음·의미의 동일성(연관성)이다.'},
  {id:'e9',sec:'10강',label:'谓语와 述语의 개념적 차이를 층차 분석법(主谓结构, 述宾结构)을 사용하여 설명하라.',
   model:'谓语와 述语는 같은 층위의 개념이 아니며 谓语가 述语를 포함한다. 층차 분석법으로 문장을 분석할 때 먼저 主谓结构로 나누어 主语와 谓语를 구분한다(主语在前, 谓语在后). 主语는 진술 대상(陈述对象)이고 谓语는 主语에 대한 진술 전체이다. 이후 谓语 내부를 다시 述宾结构로 나누어 述语와 宾语를 구분한다(述语在前, 宾语在后). 述语는 동작을 나타내고 宾语는 동작이 관계하는 대상을 나타낸다. 즉 谓语는 主语를 전제로 한 개념이고, 述语는 宾语(또는 보어)를 전제로 한 개념이다.'},
  {id:'e10',sec:'10강',label:'시량보어와 동량보어에서 목적어의 종류(일반명사·인칭대사·인명/지명)에 따른 위치 순서를 표 형식이 아닌 서술로 설명하고 예문을 들라.',
   model:'[시량보어] 목적어가 일반명사일 때: 주어+동사+시량보어+(的)+목적어. 목적어가 인칭대사일 때: 주어+동사+목적어+시량보어. 목적어가 인명/지명일 때: 주어+동사+시량보어+(的)+목적어. 예문: 他一直休息了五天(기본문형). [동량보어] 목적어가 일반 사물일 때: 주어+동사+동량보어+목적어. 목적어가 인칭대사일 때: 주어+동사+목적어+동량보어. 목적어가 인명/지명일 때: 주어(+목적어)+동량사(+목적어) 형식이 모두 가능하다.'},
  {id:'e11',sec:'10강',label:'방향보어를 단순방향보어와 복합방향보어로 나누고, 이동방식과 이동방향 기준에 따른 구성을 설명한 뒤 上·下·出·过来·起来의 확장의미를 서술하라.',
   model:'단순방향보어: 来, 去, 上, 下, 进, 出, 回, 过, 起. 복합방향보어: 上来, 上去, 下来, 下去, 进来, 进去, 出来, 出去, 回来, 回去, 过来, 过去, 起来 — \'이동의 방식\'(上下进出回过起开)과 \'이동의 방향\'(来去)의 결합. 확장의미는 유추되지 않으며 하나만 있지 않다. 上: 목표달성(考上大学), 접촉부착, 시작지속, 첨가. 下: 분리, 남겨짐, 동→정, 수용. 出: 인식, 무→유. 过来: 비정상→정상(改过来). 起来: 시작, 예측/평가, 분산→집중, 떠오름.'},
  {id:'e12',sec:'10강',label:'복합방향보어에서 목적어의 종류(일반명사·처소사·이합동사)에 따른 보어와 목적어의 어순 규칙을 예문과 함께 설명하라.',
   model:'①목적어가 일반명사인 경우: 복합방향보어 사이나 뒤에 모두 가능. 예) 前面走进一个人来(O), 前面走进来一个人(O). ②목적어가 처소사인 경우: 복합방향보어 사이에만 가능. 예) 走下楼来(O), 走下来楼(X). ③동사가 이합동사인 경우: 복합방향보어 사이에만 가능. 예) 他说起话来很有幽默(O), 他说话起来 및 他说起来话(X). 즉 목적어의 종류에 따라 보어와 목적어의 위치 관계가 달라지며, 일반명사를 제외하면 모두 복합방향보어 사이에만 위치할 수 있다.'},
  {id:'e13',sec:'11강',label:'연동문과 겸어문을 형식(S+V1+(O1)+V2+(O2))과 의미관계 측면에서 비교하고, 我去图书馆学习 / 我让他去图书馆学习를 예로 들어 설명하라.',
   model:'연동문(S+V1+(O1)+V2+(O2)): 하나의 주어가 두 개 이상의 밀접하게 관련된 술어를 취하며 시간적 발생 순서가 있다. 겸어문(S+V1+겸어+V2+O2): V1의 목적어가 V2의 주어를 겸하는 \'겸어\'를 가진다. 공통점은 형식이 NP1+VP1+NP2+VP2로 동일하다는 점이다. 차이점: 연동문은 대주어가 모든 술어의 시사가 된다 — 我去图书馆学习에서 我는 去의 시사이자 学习의 시사이다. 겸어문에서는 시킨 주체와 동작을 행하는 자가 다르다 — 我让他去图书馆学习에서 让을 시킨 주체는 我이고, 去와 学习의 시사는 他이다(他가 겸어). 겸어문의 V1 유형은 ①사역·요구·명령, ②심리상태, ③호칭이나 인정의 의미를 가진 동사이다.'},
  {id:'e14',sec:'11강',label:'연동문의 어법적 특징 5가지를 설명하고, 동태조사 了着过가 술어 사이의 어디에 붙을 수 있는지 我去过图书馆学习 / 我去图书馆学习过를 예로 설명하라.',
   model:'연동문의 어법특징: ①진술하는 주어는 하나만 있다. ②쉼표로 술어 사이를 띄어 쓸 수 없다. ③일반적으로 술어의 위치를 바꿀 수 없다. ④술어 사이에는 연합·주술·동빈·보충 관계가 없으며 관련사도 쓰이지 않는다. ⑤술어는 모두 목적어를 가질 수 있다. 동태조사 了着过는 첫 번째 동사 뒤(我去过图书馆学习)나 마지막 동사 뒤(我去图书馆学习过) 모두에 붙을 수 있으며, 의미가 약간 달라진다.'},
  {id:'e15',sec:'11강',label:'겸어문, 이중목적어문, 주술문(주술술어문)을 형식과 예문을 들어 비교 설명하라.',
   model:'겸어문: 주어+동사1+겸어(명사/대명사)+동사2+… 의 형식으로, 어떤 성분이 동사1의 목적어와 동사2의 주어를 겸한다. 예) 他让我转告你 — 让은 사역, 동사1의 유형은 사역·요구·명령/심리상태/호칭·인정이 있다. 이중목적어문: 주어+동사+간접목적어+직접목적어의 형식으로, 동사가 두 개의 목적어를 취한다. 예) 他给我三块钱(给+간접목적어 我+직접목적어 三块钱). 주술문(주술술어문): 주어+술어(술어 자체가 주술구조)의 형식. 예) 他身体很好 — 他가 大主语, 身体很好가 술어(전체가 진술). 我希望他学习汉语와 같은 문장도 서술 문장으로 분석될 수 있다.'},
  {id:'e16',sec:'12강',label:'존현문을 존재문과 은현문으로 나누어 형식을 설명하고, 부정 형식(没/不)의 사용 조건을 早上来了一位客人 예문과 함께 서술하라.',
   model:'존재문: 처소사(주어)+동사(有/是)+명사(존재하는 사물). 은현문: 처소사어(시간사어)(주어)+동사+명사(나타나거나 사라진 사물). 존현문의 부정 형식은 ①일반적으로 술어동사 앞에 没를 사용한다. ②가설이나 불허, 계획되지 않음을 나타내는 상황에서만 술어동사 앞에 不를 사용한다. 早上来了一位客人에서 客人은 시사이며, 이 예문은 존현문의 빈어가 반드시 수사(受事)는 아님을 보여준다.'},
  {id:'e17',sec:'13강',label:'把구문 동사 뒤에 올 수 있는 부가성분의 종류를 나열하고, 부정부사 不/没/别의 어순상 위치를 설명하라.',
   model:'把구문(被구문) 동사 뒤 부가성분: 결과보어, 방향보어, 상태보어(=정태보어), 개사구보어, 정도보어, 동량보어(횟수), 시량보어(시간), 동사 중첩, 동사의 목적어, 了·着·过(过는 특정 동사로도 쓰임), 동사 앞 수사/부사(확실하지 않음) 등이다. 把구문에서 부정부사(不, 没, 别)의 위치: 주어+不/没/别+把+목적어+동사+기타성분의 어순으로, 부정부사는 반드시 把 앞에 온다.'},
  {id:'e18',sec:'13강',label:'被 외 피동문 표지(叫, 让, 给)의 용법상·의미상 차이를 넓은 의미/좁은 의미의 피동, 행위자 생략 가능 여부를 포함하여 설명하라.',
   model:'피동의 의미를 나타내는 구문에는 被, 叫, 让, 给 등의 전치사가 쓰이며, 일반적으로 被를 대표로 하여 \'被字句\'라 부른다(좁은 의미의 피동은 被, 넓은 의미는 被·叫·让·给 모두 포함). 이 전치사들의 뒤에는 동작의 주동자(행위자)가 오며, 일반적으로 행위자는 생략 가능하다. 단, 让·给를 사용할 경우 동작의 행위자 생략이 불가능하며, 화자가 원하지 않는 상황이 발생했음을 나타낸다. 被자문은 행위 주체를 표현할 필요가 없을 때 被를 직접 동사 앞에 놓아 피동을 나타낼 수 있지만, 叫·让·给는 행위 주체 없이 바로 동사 앞에 놓일 수 없다. 叫·让은 被로 바꿀 수 있으나 반대(被→叫·让)는 불가능하다. 给는 피동을 강조하는 구어체 표현(给拿走了)에 쓰인다.'},
  {id:'e19',sec:'13강',label:'下课以后我要回去家拿些东西가 비규범적인 문장인 이유를 설명하고 올바르게 고쳐라.',
   model:'下课以后我要回去家拿些东西가 비규범적인 이유: 回去는 복합방향보어인데, 목적어 家가 처소사이다. 복합방향보어에서 목적어가 처소사인 경우는 복합방향보어 사이에만 위치할 수 있으므로(走下楼来 O, 走下来楼 X와 동일한 규칙), 回去家(X)는 비문이다. 올바른 수정: 下课以后我要回家去拿些东西(回家去 — 복합방향보어 사이에 처소사 목적어 위치) 또는 下课以后我要回家拿些东西(단순방향보어 回를 사용).'},
];

const wrongMap={};
let curTab='blank';
let curFilter='all';

function norm(s){ return s.trim().toLowerCase().replace(/\s+/g,''); }

function buildBlankTpl(tpl, blanks){
  let result = tpl;
  blanks.forEach(b=>{
    const re = new RegExp('<b data-id="'+b.id+'">[^<]*<\\/b>');
    result = result.replace(re,
      '<span class="blank-wrap"><input id="'+b.id+'" data-ans="'+b.ans+'" data-lbl="'+b.lbl+'" placeholder="'+b.lbl+'"></span>'
    );
  });
  return result;
}

function renderBlanks(){
  const container = document.getElementById('page-blank');
  container.innerHTML = '';
  const bySec = {};
  BLANKS.forEach(q=>{ if(!bySec[q.sec]) bySec[q.sec]=[]; bySec[q.sec].push(q); });
  const secNames = {'7강':'단어와 형태소','8강':'구사법과 구형법','9강':'품사 분류',
    '10강':'문장성분','11강':'연동문과 겸어문','12강':'존현문','13강':'把·被구문'};
  Object.keys(bySec).forEach(sec=>{
    const sl = document.createElement('div');
    sl.className='section-label'; sl.setAttribute('data-sec',sec);
    sl.textContent = sec + (secNames[sec]?' · '+secNames[sec]:'');
    container.appendChild(sl);
    bySec[sec].forEach(q=>{
      const card = document.createElement('div');
      card.className='qcard'; card.id='card-'+q.id; card.setAttribute('data-sec',q.sec);
      card.innerHTML=
        '<div class="qmeta"><span class="qnum">'+q.id+'</span><span class="badge badge-blank">중국어 빈칸</span></div>'+
        '<div class="q-label">'+q.label+'</div>'+
        '<div class="qtext">'+buildBlankTpl(q.tpl,q.blanks)+'</div>'+
        '<div class="hint">답은 중국어(한자)로 입력</div>'+
        '<div class="ans-box" id="ans-'+q.id+'"></div>'+
        '<div class="bottom-row">'+
        '<button class="btn-check" onclick="checkBlank(\''+q.id+'\')">채점</button>'+
        '<span class="fb" id="fb-'+q.id+'"></span></div>';
      container.appendChild(card);
    });
  });
  updateTotal();
}

function renderEssays(){
  const container = document.getElementById('page-essay');
  container.innerHTML = '';
  const bySec = {};
  ESSAYS.forEach(q=>{ if(!bySec[q.sec]) bySec[q.sec]=[]; bySec[q.sec].push(q); });
  Object.keys(bySec).forEach(sec=>{
    const sl = document.createElement('div');
    sl.className='section-label'; sl.setAttribute('data-sec',sec);
    sl.textContent = sec;
    container.appendChild(sl);
    bySec[sec].forEach(q=>{
      const card = document.createElement('div');
      card.className='qcard'; card.id='ecard-'+q.id; card.setAttribute('data-sec',q.sec);
      card.innerHTML=
        '<div class="qmeta"><span class="qnum">'+q.id+'</span><span class="badge badge-essay">서술형</span></div>'+
        '<div class="qtext" style="font-weight:500;margin-bottom:10px">'+q.label+'</div>'+
        '<textarea class="essay-area" id="ea-'+q.id+'" placeholder="여기에 답안을 작성하세요..."></textarea>'+
        '<div class="essay-ans-box" id="eans-'+q.id+'"><strong>모범 답안</strong>'+q.model+'</div>'+
        '<div class="bottom-row"><button class="btn-check" onclick="toggleEssayAns(\''+q.id+'\')">정답 보기 / 닫기</button></div>';
      container.appendChild(card);
    });
  });
}

function checkBlank(qid){
  const q = BLANKS.find(x=>x.id===qid);
  if(!q) return;
  let ok=0;
  q.blanks.forEach(b=>{
    const el=document.getElementById(b.id); if(!el) return;
    const alts=b.ans.split('|');
    const val=norm(el.value);
    const correct=alts.some(a=>val===norm(a));
    el.className=correct?'ok':'ng';
    if(correct){ ok++; delete wrongMap[qid+'_'+b.lbl]; }
    else wrongMap[qid+'_'+b.lbl]={qid,label:q.label,lbl:b.lbl,canon:b.ans.split('|')[0],userVal:el.value};
  });
  const total=q.blanks.length;
  const allOk=ok===total;
  const card=document.getElementById('card-'+qid);
  card.classList.toggle('correct',allOk); card.classList.toggle('wrong',!allOk);
  const fb=document.getElementById('fb-'+qid);
  fb.textContent=ok+'/'+total+' 정답'; fb.className='fb '+(allOk?'ok':'ng');
  const ansEl=document.getElementById('ans-'+qid);
  ansEl.innerHTML='정답: '+q.blanks.map(b=>'<span style="margin-right:10px"><span style="opacity:.65">'+b.lbl+'</span> → '+b.ans.split('|')[0]+'</span>').join('');
  ansEl.classList.add('show');
  renderWN(); updateScore();
}

function toggleEssayAns(qid){
  document.getElementById('eans-'+qid).classList.toggle('show');
}

function checkAllVisible(){
  if(curTab!=='blank') return;
  BLANKS.forEach(q=>{
    const card=document.getElementById('card-'+q.id);
    if(card && card.style.display!=='none') checkBlank(q.id);
  });
}

function showAllAns(){
  if(curTab==='blank') BLANKS.forEach(q=>{ const el=document.getElementById('ans-'+q.id); if(el) el.classList.add('show'); });
  else if(curTab==='essay') ESSAYS.forEach(q=>{ const el=document.getElementById('eans-'+q.id); if(el) el.classList.add('show'); });
}

function resetVisible(){
  BLANKS.forEach(q=>{
    q.blanks.forEach(b=>{ const el=document.getElementById(b.id); if(el){el.value='';el.className='';} });
    const card=document.getElementById('card-'+q.id);
    if(card){ card.classList.remove('correct','wrong'); }
    const fb=document.getElementById('fb-'+q.id); if(fb){fb.textContent='';fb.className='fb';}
    const ans=document.getElementById('ans-'+q.id); if(ans){ans.classList.remove('show');ans.innerHTML='';}
  });
  ESSAYS.forEach(q=>{
    const ta=document.getElementById('ea-'+q.id); if(ta) ta.value='';
    const ans=document.getElementById('eans-'+q.id); if(ans) ans.classList.remove('show');
  });
  Object.keys(wrongMap).forEach(k=>delete wrongMap[k]);
  renderWN(); updateScore();
}

function switchTab(tab, btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-blank').classList.toggle('hidden', tab!=='blank');
  document.getElementById('page-essay').classList.toggle('hidden', tab!=='essay');
  document.getElementById('page-wrong').classList.toggle('hidden', tab!=='wrong');
  document.getElementById('filter-row').classList.toggle('hidden', tab==='wrong');
  document.getElementById('action-row').classList.toggle('hidden', tab==='wrong');
  document.getElementById('btn-all').classList.toggle('hidden', tab!=='blank');
  filterSection(curFilter, document.querySelector('.filter-btn.on'));
}

function filterSection(sec, btn){
  curFilter=sec;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  ['#page-blank .qcard','#page-blank .section-label','#page-essay .qcard','#page-essay .section-label'].forEach(sel=>{
    document.querySelectorAll(sel).forEach(el=>{
      el.style.display=(sec==='all'||el.getAttribute('data-sec')===sec)?'':'none';
    });
  });
}

function renderWN(){
  const body=document.getElementById('wn-body');
  const cnt=document.getElementById('wn-cnt');
  const keys=Object.keys(wrongMap);
  cnt.textContent=keys.length;
  document.getElementById('sc-wn').textContent=keys.length;
  if(!keys.length){ body.innerHTML='<div class="empty">오답이 없어요.</div>'; return; }
  body.innerHTML=keys.map(k=>{
    const w=wrongMap[k];
    return '<div class="wn-item"><div class="wn-q">'+w.label+' &nbsp;|&nbsp; '+w.lbl+'</div>'+
      '<div class="wn-row">'+
      (w.userVal?'<span class="wn-wrong">✗ '+w.userVal+'</span>':'<span style="color:var(--text-3);font-size:12px">미입력</span>')+
      '<span class="wn-right">✓ '+w.canon+'</span></div></div>';
  }).join('');
}

function clearWN(){ Object.keys(wrongMap).forEach(k=>delete wrongMap[k]); renderWN(); }

function updateScore(){
  let ok=0, ng=0;
  document.querySelectorAll('input[data-ans]').forEach(el=>{
    if(el.className==='ok') ok++;
    else if(el.className==='ng') ng++;
  });
  document.getElementById('sc-ok').textContent=ok;
  document.getElementById('sc-ng').textContent=ng;
}

function updateTotal(){
  let total=0;
  BLANKS.forEach(q=>total+=q.blanks.length);
  document.getElementById('sc-tot').textContent=total;
}

renderBlanks();
renderEssays();
renderWN();
</script>
</body>
</html>
