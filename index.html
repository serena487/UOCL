
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary)}

.app{padding:1.25rem 0.75rem;max-width:660px}

.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1.25rem}
.title{font-size:18px;font-weight:500}
.tab-row{display:flex;gap:6px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:3px}
.tab{padding:5px 14px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--color-text-secondary);font-family:var(--font-sans)}
.tab.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary)}

.stats{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 14px;min-width:72px}
.stat-n{font-size:20px;font-weight:500}
.stat-l{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.stat-n.ok{color:var(--color-text-success)}
.stat-n.ng{color:var(--color-text-danger)}

.action-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
button{font-family:var(--font-sans);cursor:pointer}
.btn{padding:7px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;font-size:13px;color:var(--color-text-primary)}
.btn:hover{background:var(--color-background-secondary)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary)}
.btn-sm:hover{background:var(--color-background-secondary)}
.btn-check{padding:5px 12px;font-size:12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary)}
.btn-check:hover{background:var(--color-background-secondary)}

.section-label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.06em;margin:1.5rem 0 0.6rem;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary)}

.qcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:0.75rem;transition:border-color .15s}
.qcard.correct{border-color:var(--color-border-success)}
.qcard.wrong{border-color:var(--color-border-danger)}

.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qnum{font-size:11px;color:var(--color-text-tertiary)}
.qtype-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.badge-blank{background:var(--color-background-info);color:var(--color-text-info)}
.badge-essay{background:var(--color-background-warning);color:var(--color-text-warning)}

.qtext{font-size:14px;line-height:1.9;margin-bottom:10px}

.blank-wrap{display:inline-block;position:relative;vertical-align:bottom;margin:0 2px}
.blank-wrap input{border:none;border-bottom:1.5px solid var(--color-border-primary);background:transparent;outline:none;font-size:14px;color:var(--color-text-primary);text-align:center;font-family:var(--font-sans);padding:0 4px;min-width:72px}
.blank-wrap input.ok{color:var(--color-text-success);border-bottom-color:var(--color-border-success)}
.blank-wrap input.ng{color:var(--color-text-danger);border-bottom-color:var(--color-border-danger)}

.essay-area{width:100%;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:14px;font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-secondary);resize:vertical;min-height:80px;line-height:1.7;margin-bottom:10px}
.essay-area:focus{outline:none;border-color:var(--color-border-primary);background:var(--color-background-primary)}

.ans-box{display:none;background:var(--color-background-success);border-radius:var(--border-radius-md);padding:8px 12px;font-size:13px;color:var(--color-text-success);margin-top:6px;line-height:1.6}
.ans-box.show{display:block}
.essay-ans-box{display:none;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;font-size:13px;color:var(--color-text-secondary);margin-top:6px;line-height:1.7;border-left:3px solid var(--color-border-success)}
.essay-ans-box.show{display:block}

.bottom-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.fb{font-size:12px}
.fb.ok{color:var(--color-text-success)}
.fb.ng{color:var(--color-text-danger)}

.wn-wrap{margin-top:2rem;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem}
.wn-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wn-title{font-size:15px;font-weight:500}
.wn-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--color-background-danger);color:var(--color-text-danger)}
.wn-item{padding:9px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.wn-item:last-child{border-bottom:none}
.wn-q{font-size:12px;color:var(--color-text-tertiary);margin-bottom:3px}
.wn-row{display:flex;gap:16px;font-size:13px}
.wn-wrong{color:var(--color-text-danger)}
.wn-right{color:var(--color-text-success)}
.empty{font-size:13px;color:var(--color-text-tertiary);padding:6px 0}

.filter-row{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.filter-btn{padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:transparent;font-size:12px;color:var(--color-text-secondary);cursor:pointer}
.filter-btn.on{background:var(--color-background-primary);border-color:var(--color-border-primary);color:var(--color-text-primary);font-weight:500}

.page-blank{display:block}
.page-essay{display:none}
.page-wrong{display:none}
</style>

<div class="app">
<h2 class="sr-only">중어이 기말 문제 풀기</h2>

<div class="topbar">
  <div class="title">중어이 기말 완전판</div>
  <div class="tab-row">
    <button class="tab active" onclick="switchTab('blank',this)">빈칸형</button>
    <button class="tab" onclick="switchTab('essay',this)">서술형</button>
    <button class="tab" onclick="switchTab('wrong',this)">오답노트</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n ok" id="sc-ok">0</div><div class="stat-l">정답</div></div>
  <div class="stat"><div class="stat-n ng" id="sc-ng">0</div><div class="stat-l">오답</div></div>
  <div class="stat"><div class="stat-n" id="sc-tot">0</div><div class="stat-l">전체</div></div>
  <div class="stat"><div class="stat-n" id="sc-wn">0</div><div class="stat-l">오답노트</div></div>
</div>

<div class="action-row">
  <button class="btn" id="btn-all" onclick="checkAllVisible()">전체 채점</button>
  <button class="btn" onclick="resetVisible()">초기화</button>
  <button class="btn" onclick="showAllAns()">정답 모두 보기</button>
</div>

<div class="filter-row" id="filter-row">
  <button class="filter-btn on" onclick="filterSection('all',this)">전체</button>
  <button class="filter-btn" onclick="filterSection('7강',this)">7강</button>
  <button class="filter-btn" onclick="filterSection('8강',this)">8강</button>
  <button class="filter-btn" onclick="filterSection('9강',this)">9강</button>
  <button class="filter-btn" onclick="filterSection('10강',this)">10강</button>
  <button class="filter-btn" onclick="filterSection('11강',this)">11강</button>
  <button class="filter-btn" onclick="filterSection('12강',this)">12강</button>
  <button class="filter-btn" onclick="filterSection('13강',this)">13강</button>
</div>

<div class="page-blank" id="page-blank"></div>
<div class="page-essay" id="page-essay"></div>
<div class="page-wrong" id="page-wrong">
  <div class="wn-wrap">
    <div class="wn-head"><i class="ti ti-bookmark" style="font-size:18px" aria-hidden="true"></i><span class="wn-title">오답 노트</span><span class="wn-badge" id="wn-cnt">0</span></div>
    <div id="wn-body"><div class="empty">아직 채점된 오답이 없어요.</div></div>
    <button class="btn-sm" style="margin-top:10px;color:var(--color-text-danger);border-color:var(--color-border-danger)" onclick="clearWN()">오답 초기화</button>
  </div>
</div>
</div>

   model:'겸어문: 주어+V1+겸어(명/대명)+V2. NP2가 V1의 목적어이자 V2의 주어. 예) 他让我转告你. 이중목적어문: 동사가 간접목적어+직접목적어 2개를 취함. 예) 他给我三块钱(给+我+三块钱). 주술술어문: 주어+주술구조 술어. 大主语-小主语 간 의미관계(시사·수사·시간·장소·도구·영속 등). 예) 他身体很好(他=大주어, 身体很好=술어).'},
  {id:'e13',sec:'12강',label:'존현문의 구조, 의미, 부정 형식을 설명하라.',
   model:'존현문은 어떤 처소에 사물이 존재하거나 나타나거나 사라짐을 나타낸다. 구조: 처소사어(시간사어)+동사+명사. 존재문은 有·是, 은현문은 来·去·出 등의 동사를 사용. 빈어는 불특정 명사이며 반드시 수사(受事)는 아니다. 부정: 일반적으로 술어동사 앞에 没를 쓰고(没来一个人), 가설·불허·계획되지 않음을 나타낼 때만 不를 사용한다.'},
  {id:'e14',sec:'13강',label:'把자문에서 동사 뒤에 반드시 부가성분이 있어야 하는 이유와 그 종류를 설명하라.',
   model:'把구문은 \'처치(处置)\'와 \'致使\'의 의미를 가지므로 동작의 결과나 영향이 목적어에 미침을 반드시 나타내야 한다. 따라서 동사만 단독으로 올 수 없고 부가성분이 필수적이다. 종류: 결과보어, 방향보어, 상태보어(정태보어), 개사구보어, 정도보어, 동량보어, 시량보어, 동사 중첩, 동사의 목적어, 了·着·过, 동사 앞 수사/부사/개사구 등.'},
  {id:'e15',sec:'13강',label:'被자문 외 피동 표지(叫·让·给)의 용법상 차이를 설명하라.',
   model:'被: 대표적 피동 표지. 동작 행위자를 직접 동사 앞에 생략 가능. 叫·让: 被로 바꿀 수 있으나 반대(被→叫·让)는 불가. 행위자 없이 바로 동사 앞에 올 수 없음. 给: 구어체적 표현, 피동을 강조. 让·给는 동작 행위자를 생략할 수 없다. 叫·让·给 모두 화자가 원하지 않는 상황이 발생했음을 나타낼 때 주로 쓰인다. 예) 书给拿走了(O), 书被拿走了(O).'},
  {id:'e16',sec:'13강',label:'下课以后我要回去家拿些东西가 비규범적인 이유를 설명하고 바르게 고쳐라.',
   model:'비규범적 이유: 回去는 복합방향보어인데, 목적어 家가 처소사이므로 복합방향보어 사이에만 위치해야 한다(回去家 X → 回家去 O). 또한 이합동사가 포함된 구조에서의 규칙을 위반했다. 수정: 下课以后我要回家去拿些东西. 또는 목적어를 방향보어 앞으로 이동하여 下课以后我要回家拿些东西(단순방향보어 사용).'},
];

function renderBlanks(){
  const container=document.getElementById('page-blank');
  container.innerHTML='';
  const bySec={};
  BLANKS.forEach(q=>{
    if(!bySec[q.sec]) bySec[q.sec]=[];
    bySec[q.sec].push(q);
  });
  Object.keys(bySec).forEach(sec=>{
    const sl=document.createElement('div');
    sl.className='section-label';
    sl.textContent=sec+' · '+{
      '7강':'단어와 형태소','8강':'구사법과 구형법','9강':'품사 분류',
      '10강':'문장성분','11강':'연동문과 겸어문','12강':'존현문','13강':'把·被구문'
    }[sec];
    sl.setAttribute('data-sec',sec);
    container.appendChild(sl);
    bySec[sec].forEach(q=>{
      const card=document.createElement('div');
      card.className='qcard';
      card.id='card-'+q.id;
      card.setAttribute('data-sec',q.sec);
      let html='<div class="qmeta"><span class="qnum">'+q.id+'</span><span class="qtype-badge badge-blank">빈칸형</span></div>';
      html+='<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:6px">'+q.label+'</div>';
      let tpl=q.tpl;
      q.blanks.forEach(b=>{
        tpl=tpl.replace('<b id="'+b.id+'">'+b.id.split('_')[1].replace(/[a-z]/g,'($&)')+'</b>',
          '<span class="blank-wrap"><input id="'+b.id+'" data-ans="'+b.ans+'" data-lbl="'+b.lbl+'" placeholder="'+b.lbl+'"></span>');
        tpl=tpl.replace(/<b id="[^"]+">(\([a-z]\))<\/b>/g,function(m,p1,offset,str){return m;});
      });
      q.blanks.forEach(b=>{
        const re=new RegExp('<b id="'+b.id+'">[^<]*</b>');
        tpl=tpl.replace(re,'<span class="blank-wrap"><input id="'+b.id+'" data-ans="'+b.ans+'" data-lbl="'+b.lbl+'" placeholder="'+b.lbl+'"></span>');
      });
      html+='<div class="qtext">'+tpl+'</div>';
      html+='<div class="ans-box" id="ans-'+q.id+'"></div>';
      html+='<div class="bottom-row"><button class="btn-check" onclick="checkBlank(\''+q.id+'\')">채점</button><span class="fb" id="fb-'+q.id+'"></span></div>';
      card.innerHTML=html;
      container.appendChild(card);
    });
  });
  updateTotal();
}

function renderEssays(){
  const container=document.getElementById('page-essay');
  container.innerHTML='';
  const bySec={};
  ESSAYS.forEach(q=>{
    if(!bySec[q.sec]) bySec[q.sec]=[];
    bySec[q.sec].push(q);
  });
  Object.keys(bySec).forEach(sec=>{
    const sl=document.createElement('div');
    sl.className='section-label';
    sl.textContent=sec;
    sl.setAttribute('data-sec',sec);
    container.appendChild(sl);
    bySec[sec].forEach(q=>{
      const card=document.createElement('div');
      card.className='qcard';
      card.id='ecard-'+q.id;
      card.setAttribute('data-sec',q.sec);
      let html='<div class="qmeta"><span class="qnum">'+q.id+'</span><span class="qtype-badge badge-essay">서술형</span></div>';
      html+='<div class="qtext" style="font-weight:500;margin-bottom:10px">'+q.label+'</div>';
      html+='<textarea class="essay-area" id="ea-'+q.id+'" placeholder="여기에 답안을 작성하세요..."></textarea>';
      html+='<div class="essay-ans-box" id="eans-'+q.id+'"><strong style="font-size:12px;color:var(--color-text-tertiary);display:block;margin-bottom:4px">모범 답안</strong>'+q.model+'</div>';
      html+='<div class="bottom-row"><button class="btn-check" onclick="toggleEssayAns(\''+q.id+'\')">정답 보기</button></div>';
      card.innerHTML=html;
      container.appendChild(card);
    });
  });
}

function checkBlank(qid){
  const q=BLANKS.find(x=>x.id===qid);
  if(!q) return;
  let ok=0,fails=[];
  q.blanks.forEach(b=>{
    const el=document.getElementById(b.id);
    if(!el) return;
    const alts=b.ans.split('|');
    const val=el.value.trim().toLowerCase().replace(/\s+/g,' ');
    const correct=alts.some(a=>val===a.trim().toLowerCase().replace(/\s+/g,' '));
    el.className=correct?'ok':'ng';
    if(correct) ok++;
    else fails.push({lbl:b.lbl,ans:b.ans.split('|')[0],userVal:el.value});
  });
  const total=q.blanks.length;
  const card=document.getElementById('card-'+qid);
  const allOk=ok===total;
  card.classList.remove('correct','wrong');
  card.classList.add(allOk?'correct':'wrong');
  const fb=document.getElementById('fb-'+qid);
  fb.textContent=ok+'/'+total+' 정답';
  fb.className='fb '+(allOk?'ok':'ng');
  const ansEl=document.getElementById('ans-'+qid);
  const ansHtml=q.blanks.map(b=>'<span style="margin-right:10px;font-size:12px"><span style="opacity:.7">'+b.lbl+'</span> → '+b.ans.split('|')[0]+'</span>').join('');
  ansEl.innerHTML='<i class="ti ti-check" style="font-size:12px;margin-right:4px" aria-hidden="true"></i>'+ansHtml;
  ansEl.classList.add('show');
  fails.forEach(f=>{
    wrongMap[qid+'_'+f.lbl]={qid,label:q.label,lbl:f.lbl,canon:f.ans,userVal:f.userVal};
  });
  q.blanks.filter((b,i)=>{
    const el=document.getElementById(b.id);
    return el&&el.className==='ok';
  }).forEach(b=>{
    delete wrongMap[qid+'_'+b.lbl];
  });
  renderWN();
  updateScore();
}

function toggleEssayAns(qid){
  const el=document.getElementById('eans-'+qid);
  el.classList.toggle('show');
}

function checkAllVisible(){
  if(curTab==='blank'){
    BLANKS.forEach(q=>{
      const card=document.getElementById('card-'+q.id);
      if(card&&card.style.display!=='none') checkBlank(q.id);
    });
  }
}

function showAllAns(){
  if(curTab==='blank'){
    BLANKS.forEach(q=>{
      const el=document.getElementById('ans-'+q.id);
      if(el) el.classList.add('show');
    });
  } else if(curTab==='essay'){
    ESSAYS.forEach(q=>{
      const el=document.getElementById('eans-'+q.id);
      if(el) el.classList.add('show');
    });
  }
}

function resetVisible(){
  if(curTab==='blank'){
    BLANKS.forEach(q=>{
      q.blanks.forEach(b=>{
        const el=document.getElementById(b.id);
        if(el){el.value='';el.className='';}
      });
      const card=document.getElementById('card-'+q.id);
      if(card) card.classList.remove('correct','wrong');
      const fb=document.getElementById('fb-'+q.id);
      if(fb){fb.textContent='';fb.className='fb';}
      const ans=document.getElementById('ans-'+q.id);
      if(ans){ans.classList.remove('show');ans.innerHTML='';}
    });
  } else if(curTab==='essay'){
    ESSAYS.forEach(q=>{
      const ta=document.getElementById('ea-'+q.id);
      if(ta) ta.value='';
      const ans=document.getElementById('eans-'+q.id);
      if(ans) ans.classList.remove('show');
    });
  }
  Object.keys(wrongMap).forEach(k=>delete wrongMap[k]);
  renderWN();
  document.getElementById('sc-ok').textContent=0;
  document.getElementById('sc-ng').textContent=0;
}

function switchTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-blank').style.display=tab==='blank'?'block':'none';
  document.getElementById('page-essay').style.display=tab==='essay'?'block':'none';
  document.getElementById('page-wrong').style.display=tab==='wrong'?'block':'none';
  document.getElementById('filter-row').style.display=(tab==='blank'||tab==='essay')?'flex':'none';
  document.getElementById('btn-all').style.display=tab==='wrong'?'none':'inline-block';
  filterSection(curFilter,document.querySelector('.filter-btn.on'));
}

function filterSection(sec,btn){
  curFilter=sec;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  document.querySelectorAll('#page-blank .qcard, #page-blank .section-label').forEach(el=>{
    el.style.display=(sec==='all'||el.getAttribute('data-sec')===sec)?'':'none';
  });
  document.querySelectorAll('#page-essay .qcard, #page-essay .section-label').forEach(el=>{
    el.style.display=(sec==='all'||el.getAttribute('data-sec')===sec)?'':'none';
  });
}

function renderWN(){
  const body=document.getElementById('wn-body');
  const cnt=document.getElementById('wn-cnt');
  const keys=Object.keys(wrongMap);
  cnt.textContent=keys.length;
  document.getElementById('sc-wn').textContent=keys.length;
  if(!keys.length){body.innerHTML='<div class="empty">오답이 없어요.</div>';return;}
  body.innerHTML=keys.map(k=>{
    const w=wrongMap[k];
    return '<div class="wn-item"><div class="wn-q">'+w.label+' | '+w.lbl+'</div><div class="wn-row">'
      +(w.userVal?'<span class="wn-wrong"><i class="ti ti-x" style="font-size:11px" aria-hidden="true"></i> '+w.userVal+'</span>':'<span style="color:var(--color-text-tertiary);font-size:12px">미입력</span>')
      +' <span class="wn-right"><i class="ti ti-check" style="font-size:11px" aria-hidden="true"></i> '+w.canon+'</span></div></div>';
  }).join('');
}

function clearWN(){
  Object.keys(wrongMap).forEach(k=>delete wrongMap[k]);
  renderWN();
}

function updateScore(){
  let ok=0,ng=0;
  document.querySelectorAll('input[data-ans]').forEach(el=>{
    if(el.className==='ok') ok++;
    else if(el.className==='ng') ng++;
  });
  document.getElementById('sc-ok').textContent=ok;
  document.getElementById('sc-ng').textContent=ng;
}

function updateTotal(){
  let total=0;
  BLANKS.forEach(q=>total+=q.blanks.length);
  document.getElementById('sc-tot').textContent=total;
}

renderBlanks();
renderEssays();
renderWN();
</script>
